name: Fetch market data (hourly)

on:
  schedule:
    - cron: "7 * * * *" # hourly, a few minutes past the hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fetch data from the public Taskmarket API
        run: node scripts/fetch-data.mjs
      - name: Commit data.json if it changed
        run: |
          git config user.name "taskmarket-live-bot"
          git config user.email "bot@taskmarket-live.local"
          git add data/data.json
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
